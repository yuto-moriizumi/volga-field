name: Validate

# mercari-rakuma-comparator から移植。
# アクションのバージョンを更新し、このリポジトリ (npm workspaces) 向けに手順を調整している。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # packages/* は dist/ を gitignore しているため、型チェックより先にビルドが必要。
      - name: Build workspace packages
        run: npm run build:shared && npm run build:core
      - name: Typecheck
        run: npm run typecheck
      - name: Check lint
        run: npm run lint
      - name: Test
        run: npm test
